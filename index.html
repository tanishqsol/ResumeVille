<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <!-- JavaScript Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>
    <script src="skrollr.js"></script>
    <script src="app.js"></script>
    <script src="app2.js"></script>
</head>

<body>
    <div id="preloader">
        <img src="./styles/loading.gif" id="loadingGif">
        <h1>Loading</h1>
    </div>

    <!-- Main Character Section -->
    <section class="character" id="sticky">
        <div class="bettyButton">
            <img src="https://i.ibb.co/hKjzvDz/betty-Face-Top-Left.png" class="bettyButtonFrontFace">
            <img src="https://i.ibb.co/8bZ3LbS/betty-Car-Sit.png" class="bettyButtonCar">
        </div>
        <div class="bettyCar"></div>
        <div class="viewer" id="girlClass"></div>
        <div class="roadAbove"></div>
        <div class="foothPath"></div>
        <div class="road">
            <div class="lines"></div>
        </div>
        <div class="thankYou">
            <h1>Thank <span>You</span></h1>
            <h3>Check out my resume <a href="resume.html">here</a></h3>
            <h2 class="theEnd">The End</h2>
        </div>
    </section>

    <!-- Background Elements -->
    <div class="grass"></div>
    <div class="main-container" id="mainContainer">
        
        <!-- Sections for Different Pages -->
        <section>
            <div class="content page1">
                <div id="typedd">
                    <p id="first"></p>
                    <p id="sec"></p>
                </div>
                <img src="https://i.ibb.co/JsThF49/house1.png" class="house1">
                <img src="https://i.ibb.co/MGw7SZQ/INTROTOUPLOADFINAL.png" id="aboutMe">
            </div>
        </section>
        
        <!-- Education Section -->
        <section>
            <div class="content page2">
                <img src="https://i.ibb.co/WfyyVQZ/wel-Res-Vill.png" class="resumeVille">
                <img src="https://i.ibb.co/5WFPB6H/eduWhite.png" class="eduMile" height="300">
            </div>
        </section>
        
        <!-- Skills Section -->
        <section>
            <div class="content page3">
                <img src="https://i.ibb.co/LNQRv89/Education-Board2.png" id="gradCap" height="450">
                <img src="https://i.ibb.co/G36z39b/underconstruction.png" id="underconstruction">
            </div>
        </section>
        
        <!-- Multi-Disciplinary Skills Section -->
        <section>
            <div class="content page5">
                <h1 class="mulDisText">MULTI-DISCIPLINARY<span> SKILLS</span></h1>
                <div class="mySkillsOne">
                    <li><h3>Design</h3><div class="bar"><span class="des"></span></div></li>
                    <li><h3>Illustration</h3><div class="bar"><span class="ill"></span></div></li>
                    <li><h3>Code</h3><div class="bar"><span class="cod"></span></div></li>
                    <li><h3>Animation</h3><div class="bar"><span class="ani"></span></div></li>
                </div>
            </div>
        </section>

        <!-- Projects Section -->
        <section class="page9section">
            <img src="https://i.ibb.co/sb3449J/PROJECTWhite-Up.png" class="projMile">
            <div class="pr1">
                <img src="https://i.ibb.co/6NPmVvM/rsv-Dilute.png" class="rsvProject">
            </div>
        </section>

        <!-- Final Pages for Additional Projects -->
        <section class="page10section">
            <div class="pr2"><img src="https://i.ibb.co/2vhXn5G/rule-Dilute.png" class="ruleEngProject"></div>
            <div class="pr3"><img src="https://i.ibb.co/HCrvd2K/nfvaas.png" class="nfvProject"></div>
        </section>

        <section class="page11section">
            <div class="pr4"><img src="https://i.ibb.co/HVzv2gf/vms.png" class="vmsProject"></div>
            <div class="pr5"><img src="https://i.ibb.co/hXqP3gG/testing.png" class="testingProject"></div>
        </section>

    </div>

    <!-- JavaScript for Typed Text Animations -->
    <script>
        new WOW().init();
        const s = skrollr.init({ smoothScrolling: true, smoothScrollingDuration: 200 });

        const typed1 = new Typed('#first', {
            strings: ["You can scroll<span class ='enterKey'> up or down"],
            typeSpeed: 20,
            startDelay: 500,
            cursorChar: '<br>'
        });
        const typed2 = new Typed('#sec', {
            strings: ["You can also use <span class ='enterKey'>right, left, up or down <span class = 'strong'>arrow keys</span>"],
            typeSpeed: 20,
            startDelay: 1300,
            cursorChar: '<br>'
        });
    </script>

    <!-- Preloader and Intro Animation -->
    <script>
        window.addEventListener("load", () => {
            const preloader = document.querySelector("#preloader");
            const loadingGif = document.querySelector("#loadingGif");
            const introBox = document.querySelector("#aboutMe");

            loadingGif.classList.add("loaderGifVanish");
            preloader.classList.add("preloaderPageVanish");

            introBox.className = 'animate__animated animate__slideInDown animate__fast';
            introBox.style.setProperty('--animate-duration', '1.5s');
            introBox.style.opacity = '1';
        });
    </script>
</body>

</html>
